# Effective parameters of the SeCAT paper run (v5.0.6 release copy).
# Captured from the run's provenance (supporting/provenance/params_used.yaml)
# with personal paths replaced by placeholders. Set manifest, reference_db,
# outdir and bind_paths for your system, then:
#   nextflow run DETerrey/SeCAT -r v5.0.6 -profile slurm,singularity -params-file params_paper.yaml
manifest: /path/to/data/secat_manifest_paper.tsv
reference_db: /path/to/references/SILVA_138.2_SSURef_NR99_tax_silva_full_align_trunc.fasta
bind_paths: /path/to/data,/path/to/references,/path/to/scratch
outdir: /path/to/outdir
analysis_mode: study
num_simulations: 100
sim_max_silva_subset: 10000
sim_use_prebuilt_subset: true
sim_abundance_model: lognormal
sim_lognormal_mu: 5
sim_lognormal_sigma: 2
sim_add_pcr_bias: true
sim_pcr_cycles: 25
sim_pcr_gc_bias: 0.65
sim_pcr_optimal_gc: 0.5
sim_add_errors: true
sim_error_rate: 0.003
sim_indel_rate: 3.0E-5
sim_error_position_bias: true
sim_add_chimeras: false
sim_chimera_rate: 0.02
trim_step_mode: absolute
trim_increment: 100
default_max_trim_steps: 50
consensus_buffer_steps: 20
max_absolute_trim_steps: 2000
min_relative_abundance: 0
min_taxa_for_bray: 3
min_median_read_depth: 100
changepoint_penalty_method: MANUAL
changepoint_penalty_multiplier: 50
sim_structure_matched_null: true
min_sample_depth: 10000
min_asv_prevalence: 2
min_asv_reads: 50
sim_cluster_identity: 0.97
sim_max_template: 1500
simulation_community_size: 0
changepoint_seed: 10010
changepoint_scan_min: 0.4
changepoint_scan_max: 2.4
changepoint_scan_by: 0.1
changepoint_bootstrap_n: 50
null_model_p_threshold: 0.05
null_model_min_consecutive: 2
null_model_min_trim_bp: 5
bc_ceiling_threshold: 0.2
retention_floor_threshold: 0.7
verdict_consensus_tolerance_bp: 500
mapping_support_band: 250
mapping_support_warn: 0.7
mapping_support_fail: 0.4
exclude_unstable_from_consensus: true
distance_cutoff_threshold: 0.2
distance_cutoff_min_trim_bp: 5
consensus_optimization_threshold: 0.2
min_consensus_studies: 3
min_consensus_coverage: 0.5
reference_alignment_mode: subset
reference_subset_size: 5000
merge_method: advanced
harmonize_metadata: true
selection_mode: roster
selection_file: examples/paper_run/selection_roster.txt
plot_dpi: 600
force_regenerate: false
use_all_asvs: true
asv_sample_size: 5000
run_validation: true
auto_trim: false
validation_levels: ASV,Genus,Family
step: standardize
keep_intermediates: true
final_outputs: /path/to/outdir/final_outputs
final_outputs_tables_dir: 2_dataset
final_outputs_verdicts_dir: 3_verdicts
final_outputs_reports_dir: 1_report
final_outputs_plots_dir: 1_report/figures
final_outputs_verification_dir: 4_verification
final_outputs_comparison_dir: 5_comparison
final_outputs_provenance_dir: supporting/provenance
final_outputs_coordinates_dir: supporting/coordinates
final_outputs_per_study_dir: supporting/per_study_data
final_outputs_taxon_impact_dir: supporting/taxon_impact
study_alignment_method: modal
max_primer_mismatch: 4
